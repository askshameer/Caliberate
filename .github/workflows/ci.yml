name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install workspace tooling
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint client
        run: npm --prefix client run lint

      - name: Audit production server dependencies
        run: npm audit --prefix server --omit=dev

      - name: Audit production client dependencies
        run: npm audit --prefix client --omit=dev

      - name: Build and run isolated feature and regression suites
        run: npm test
