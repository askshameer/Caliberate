services:
  caliberate:
    build: .
    image: caliberate:latest
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Caliberate}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Platform Administrator}
      DB_PATH: /data/caliberate.db
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-strict}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      APP_VERSION: ${APP_VERSION:-2.0.0}
    volumes:
      - caliberate-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  caliberate-data:
